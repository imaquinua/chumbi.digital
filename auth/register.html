<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>C</text></svg>">
  <title>Registro | Chumbi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            accent: '#E85D4C',
            'accent-hover': '#D14836',
            cream: '#FAF8F5',
            paper: '#F5F2ED',
            ink: '#2D2A26',
            charcoal: '#0F0E0D',
            'charcoal-light': '#1A1816',
            ash: '#E8E4DE',
            stone: '#8C8579',
          },
          fontFamily: {
            display: ['Instrument Serif', 'serif'],
            body: ['Outfit', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
  </style>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-cream dark:bg-charcoal text-ink dark:text-ash font-body antialiased min-h-screen flex flex-col"
      x-data="{
        darkMode: localStorage.getItem('darkMode') === 'true',
        loading: false,
        error: '',
        success: false,
        successMessage: '',
        name: '',
        email: '',
        password: '',
        confirmPassword: '',

        async handleSubmit() {
          this.loading = true;
          this.error = '';

          // Validar passwords
          if (this.password !== this.confirmPassword) {
            this.error = 'Las claves no coinciden';
            this.loading = false;
            return;
          }

          if (this.password.length < 6) {
            this.error = 'La clave debe tener al menos 6 caracteres';
            this.loading = false;
            return;
          }

          const { data, error } = await Auth.signUp(this.email, this.password, this.name);

          if (error) {
            this.error = this.translateError(error.message);
            this.loading = false;
            return;
          }

          // Verificar si requiere confirmacion de email
          if (data.user && !data.session) {
            this.success = true;
            this.successMessage = 'Revisa tu correo para confirmar tu cuenta.';
          } else if (data.session) {
            this.success = true;
            this.successMessage = 'Cuenta creada. Redirigiendo...';
            setTimeout(() => {
              window.location.href = '/lms/dashboard/';
            }, 1500);
          }

          this.loading = false;
        },

        async handleGoogle() {
          this.loading = true;
          this.error = '';
          const { error } = await Auth.signInWithGoogle();
          if (error) {
            this.error = this.translateError(error.message);
            this.loading = false;
          }
        },

        async handleGitHub() {
          this.loading = true;
          this.error = '';
          const { error } = await Auth.signInWithGitHub();
          if (error) {
            this.error = this.translateError(error.message);
            this.loading = false;
          }
        },

        translateError(msg) {
          const translations = {
            'User already registered': 'Este correo ya esta registrado',
            'Password should be at least 6 characters': 'La clave debe tener al menos 6 caracteres',
            'Unable to validate email address': 'Email no valido',
            'Signup is disabled': 'El registro esta deshabilitado temporalmente',
            'Supabase no configurado': 'Sistema en mantenimiento'
          };
          return translations[msg] || msg;
        }
      }"
      x-init="document.documentElement.classList.toggle('dark', darkMode)">

  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-cream/90 dark:bg-charcoal/90 backdrop-blur-xl border-b border-ink/5 dark:border-ash/5">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-3">
        <div class="w-10 h-10">
          <svg viewBox="0 0 40 40" class="w-full h-full">
            <path d="M20 4 C32 4 36 12 36 20 C36 28 32 36 20 36 C10 36 4 30 4 22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="text-accent"/>
            <text x="20" y="26" text-anchor="middle" class="text-ink dark:text-ash font-display text-sm" fill="currentColor">C</text>
          </svg>
        </div>
        <span class="font-display text-lg text-ink dark:text-ash">Chumbi</span>
      </a>
      <button
        @click="darkMode = !darkMode; localStorage.setItem('darkMode', darkMode); document.documentElement.classList.toggle('dark', darkMode)"
        class="w-10 h-10 rounded-full bg-ink/5 dark:bg-ash/10 flex items-center justify-center hover:bg-accent hover:text-cream transition-all"
      >
        <svg x-show="!darkMode" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
        </svg>
        <svg x-show="darkMode" x-cloak class="w-5 h-5 text-amber-400" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow flex items-center justify-center pt-20 px-6 py-12">
    <div class="w-full max-w-md">

      <!-- Card -->
      <div class="bg-paper dark:bg-charcoal-light rounded-2xl p-8 border border-ink/5 dark:border-ash/10 shadow-xl">

        <!-- Header -->
        <div class="text-center mb-8">
          <div class="w-16 h-16 bg-accent/10 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0ZM3 19.235v-.11a6.375 6.375 0 0 1 12.75 0v.109A12.318 12.318 0 0 1 9.374 21c-2.331 0-4.512-.645-6.374-1.766Z"/>
            </svg>
          </div>
          <h1 class="font-display text-3xl text-ink dark:text-ash">Crear Acceso</h1>
          <p class="text-stone mt-2">Unete al Dojo Digital</p>
        </div>

        <!-- Success Message -->
        <div x-show="success" x-cloak class="mb-6 p-4 bg-green-100 dark:bg-green-900/30 border border-green-300 dark:border-green-700 rounded-xl text-green-800 dark:text-green-300 text-center">
          <span x-text="successMessage"></span>
        </div>

        <!-- Error Message -->
        <div x-show="error" x-cloak class="mb-6 p-4 bg-red-100 dark:bg-red-900/30 border border-red-300 dark:border-red-700 rounded-xl text-red-800 dark:text-red-300 text-center" x-text="error"></div>

        <!-- Form -->
        <form @submit.prevent="handleSubmit()" class="space-y-4" x-show="!success">

          <div>
            <label for="name" class="block text-sm font-medium text-ink dark:text-ash mb-2">Nombre</label>
            <input
              x-model="name"
              type="text"
              id="name"
              required
              placeholder="Tu nombre"
              class="w-full px-4 py-3 rounded-xl bg-cream dark:bg-charcoal border border-ink/10 dark:border-ash/10 focus:border-accent focus:ring-2 focus:ring-accent/20 outline-none transition-all text-ink dark:text-ash placeholder:text-stone"
            />
          </div>

          <div>
            <label for="email" class="block text-sm font-medium text-ink dark:text-ash mb-2">Correo</label>
            <input
              x-model="email"
              type="email"
              id="email"
              required
              placeholder="tu@email.com"
              class="w-full px-4 py-3 rounded-xl bg-cream dark:bg-charcoal border border-ink/10 dark:border-ash/10 focus:border-accent focus:ring-2 focus:ring-accent/20 outline-none transition-all text-ink dark:text-ash placeholder:text-stone"
            />
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-ink dark:text-ash mb-2">Clave</label>
            <input
              x-model="password"
              type="password"
              id="password"
              required
              placeholder="Minimo 6 caracteres"
              class="w-full px-4 py-3 rounded-xl bg-cream dark:bg-charcoal border border-ink/10 dark:border-ash/10 focus:border-accent focus:ring-2 focus:ring-accent/20 outline-none transition-all text-ink dark:text-ash placeholder:text-stone"
            />
          </div>

          <div>
            <label for="confirmPassword" class="block text-sm font-medium text-ink dark:text-ash mb-2">Confirmar Clave</label>
            <input
              x-model="confirmPassword"
              type="password"
              id="confirmPassword"
              required
              placeholder="Repite la clave"
              class="w-full px-4 py-3 rounded-xl bg-cream dark:bg-charcoal border border-ink/10 dark:border-ash/10 focus:border-accent focus:ring-2 focus:ring-accent/20 outline-none transition-all text-ink dark:text-ash placeholder:text-stone"
            />
          </div>

          <button
            type="submit"
            :disabled="loading"
            class="w-full py-3 px-6 bg-accent hover:bg-accent-hover text-cream font-medium rounded-xl transition-all duration-300 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed mt-6"
          >
            <span x-show="!loading">Crear Acceso</span>
            <span x-show="loading" x-cloak class="flex items-center gap-2">
              <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Creando...
            </span>
          </button>
        </form>

        <!-- Divider -->
        <div class="flex items-center gap-4 my-6" x-show="!success">
          <div class="flex-grow h-px bg-ink/10 dark:bg-ash/10"></div>
          <span class="text-stone text-sm">o registrate con</span>
          <div class="flex-grow h-px bg-ink/10 dark:bg-ash/10"></div>
        </div>

        <!-- Social Login -->
        <div class="flex gap-3" x-show="!success">
          <button
            @click="handleGoogle()"
            :disabled="loading"
            class="flex-1 py-3 px-4 rounded-xl border border-ink/10 dark:border-ash/10 hover:bg-ink/5 dark:hover:bg-ash/5 transition-colors flex items-center justify-center gap-2 disabled:opacity-50"
          >
            <svg class="w-5 h-5" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            <span class="text-sm font-medium">Google</span>
          </button>
          <button
            @click="handleGitHub()"
            :disabled="loading"
            class="flex-1 py-3 px-4 rounded-xl border border-ink/10 dark:border-ash/10 hover:bg-ink/5 dark:hover:bg-ash/5 transition-colors flex items-center justify-center gap-2 disabled:opacity-50"
          >
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
            </svg>
            <span class="text-sm font-medium">GitHub</span>
          </button>
        </div>

        <!-- Login Link -->
        <p class="text-center text-stone mt-6">
          Ya tienes cuenta? <a href="login.html" class="text-accent hover:underline font-medium">Entrar</a>
        </p>
      </div>

      <!-- Back Link -->
      <a href="../index.html" class="flex items-center justify-center gap-2 mt-6 text-stone hover:text-accent transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        <span>Volver al inicio</span>
      </a>
    </div>
  </main>

  <!-- Scripts -->
  <script src="../assets/js/supabase-client.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
