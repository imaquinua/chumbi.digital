<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea Chispa - Planner</title>
    <link rel="stylesheet" href="assets/css/planner.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="notebook-container" id="notebook-container">
        <header class="planner-header">
            <h1 class="planner-title">Crea Chispa</h1>
            <div class="month-selector">
                <h2 id="current-month">Julio 2025</h2>
            </div>
            <p class="mantra">"Un 1% mejor cada día."</p>
        </header>

        <main class="planner-body">
            <section class="key-events">
                <h3>Hechos Relevantes</h3>
                <div id="key-events-list" class="key-events-list">
                    <!-- Daily entries will be generated by JS -->
                </div>
            </section>

            <section class="habit-tracker-section">
                <div class="habits">
                    <h3>Hábitos Clave</h3>
                    <div id="habit-list" class="habit-list">
                         <!-- Habit rows will be generated by JS -->
                    </div>
                </div>
                <div class="habit-graph">
                    <h3>Gráfica de Hábitos</h3>
                    <svg id="habit-chart" class="habit-chart"></svg>
                </div>
            </section>
            
            <section class="monthly-goals">
                <h3>Tres Objetivos del Mes</h3>
                <div class="goals-list">
                    <input type="text" placeholder="Ganar masa muscular...">
                    <input type="text" placeholder="Mejorar concentración...">
                    <input type="text" placeholder="Pasar más tiempo con mi gente...">
                </div>
            </section>

            <section class="monthly-reflection">
                <h3>Reflexión del Mes</h3>
                <div class="reflection-metrics">
                    <div class="metric">
                        <label for="energia">Energía:</label>
                        <input type="range" id="energia" min="1" max="10" value="8">
                        <span class="metric-value">8</span>
                    </div>
                    <div class="metric">
                        <label for="emocional">Estado Emocional:</label>
                        <input type="range" id="emocional" min="1" max="10" value="7">
                         <span class="metric-value">7</span>
                    </div>
                    <div class="metric">
                        <label for="vida">Vida Bien Vivida:</label>
                        <input type="range" id="vida" min="1" max="10" value="10">
                         <span class="metric-value">10</span>
                    </div>
                </div>
            </section>
        </main>
        <div class="planner-actions">
            <button id="export-pdf-btn" class="action-btn">Exportar a PDF</button>
            <button id="clear-data-btn" class="action-btn danger">Borrar mes</button>
        </div>
    </div>
    <script src="assets/js/planner.js"></script>
</body>
</html>
