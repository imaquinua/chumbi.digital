<header
  x-data="{
    menuOpen: false,
    darkMode: localStorage.getItem('darkMode') === 'true' || (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)
  }"
  x-init="
    document.documentElement.classList.toggle('dark', darkMode);
    $watch('darkMode', val => {
      localStorage.setItem('darkMode', val);
      document.documentElement.classList.toggle('dark', val);
    });
    $watch('menuOpen', val => {
      document.body.classList.toggle('menu-open', val);
    });
  "
  class="fixed top-0 left-0 right-0 z-50 bg-light/80 dark:bg-dark/80 backdrop-blur-xl border-b border-black/5 dark:border-white/5"
>
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    <!-- Logo -->
    <a href="index.html" class="flex items-center gap-3 group relative z-50">
      <div class="w-12 h-12 rounded-xl bg-accent text-dark font-display font-bold text-lg flex items-center justify-center transition-transform group-hover:scale-105 group-hover:rotate-3">
        CD
      </div>
      <div class="hidden sm:block">
        <span class="font-display font-semibold text-dark dark:text-light">Chumbi Digital</span>
      </div>
    </a>

    <!-- Controls -->
    <div class="flex items-center gap-3 relative z-50">
      <!-- Dark Mode Toggle -->
      <button
        @click="darkMode = !darkMode"
        class="w-10 h-10 rounded-full bg-black/5 dark:bg-white/10 flex items-center justify-center transition-all hover:bg-accent hover:text-dark hover:scale-110"
        :aria-label="darkMode ? 'Activar modo claro' : 'Activar modo oscuro'"
      >
        <svg x-show="!darkMode" x-cloak class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
        </svg>
        <svg x-show="darkMode" x-cloak class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/>
        </svg>
      </button>

      <!-- Hamburger Button -->
      <button
        @click="menuOpen = !menuOpen"
        class="w-10 h-10 rounded-full bg-black/5 dark:bg-white/10 flex items-center justify-center transition-all hover:bg-accent hover:text-dark"
        :class="menuOpen ? 'bg-accent text-dark' : ''"
        aria-label="Menu"
      >
        <div class="w-5 h-4 flex flex-col justify-between">
          <span
            class="w-full h-0.5 bg-current transition-all duration-300 origin-left"
            :class="menuOpen ? 'rotate-45 translate-x-[2px] -translate-y-[1px]' : ''"
          ></span>
          <span
            class="w-full h-0.5 bg-current transition-all duration-300"
            :class="menuOpen ? 'opacity-0 translate-x-4' : ''"
          ></span>
          <span
            class="w-full h-0.5 bg-current transition-all duration-300 origin-left"
            :class="menuOpen ? '-rotate-45 translate-x-[2px] translate-y-[1px]' : ''"
          ></span>
        </div>
      </button>
    </div>
  </div>

  <!-- Full-screen Menu Overlay -->
  <div
    x-show="menuOpen"
    x-transition:enter="transition duration-300 ease-out"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition duration-200 ease-in"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    class="fixed inset-0 top-0 bg-light dark:bg-dark z-40 pt-24 overflow-y-auto"
    @keydown.escape.window="menuOpen = false"
  >
    <nav class="max-w-7xl mx-auto px-6 py-8">
      <ul class="space-y-4">
        <template x-for="(item, index) in [
          {name: 'Inicio', href: 'index.html', emoji: ''},
          {name: 'Quien soy', href: 'quien-soy.html', emoji: ''},
          {name: 'Que hago', href: 'que-hago.html', emoji: ''},
          {name: 'Que hice', href: 'que-hice.html', emoji: ''},
          {name: 'Que me gusta', href: 'que-me-gusta.html', emoji: ''},
          {name: 'Que onda con las cosas', href: 'que-onda-cosas.html', emoji: ''},
          {name: 'Que onda con lo que siento', href: 'que-onda-sentir.html', emoji: ''},
          {name: 'Podcast', href: 'podcast.html', emoji: ''},
          {name: 'Galeria', href: 'gallery/index.html', emoji: ''},
          {name: 'Screensavers', href: 'screensavers/index.html', emoji: ''},
          {name: 'GPTs', href: 'gpts/index.html', emoji: ''},
          {name: 'Blog', href: 'blog/index.html', emoji: ''},
        ]" :key="item.name">
          <li
            x-show="menuOpen"
            x-transition:enter="transition duration-500 ease-out"
            x-transition:enter-start="opacity-0 -translate-x-8"
            x-transition:enter-end="opacity-100 translate-x-0"
            :style="`transition-delay: ${index * 40}ms`"
          >
            <a
              :href="item.href"
              @click="menuOpen = false"
              class="group flex items-center gap-4 py-2"
            >
              <span class="text-2xl" x-text="item.emoji"></span>
              <span
                class="text-3xl md:text-5xl font-display font-semibold text-dark dark:text-light group-hover:text-accent transition-colors duration-200"
                x-text="item.name"
              ></span>
              <span class="ml-auto opacity-0 group-hover:opacity-100 transition-opacity text-accent text-2xl">&rarr;</span>
            </a>
          </li>
        </template>
      </ul>

      <!-- Social links en el menu -->
      <div class="mt-12 pt-8 border-t border-black/10 dark:border-white/10">
        <div class="flex items-center gap-6">
          <a href="#" class="text-muted hover:text-accent transition-colors">Twitter</a>
          <a href="#" class="text-muted hover:text-accent transition-colors">Instagram</a>
          <a href="#" class="text-muted hover:text-accent transition-colors">GitHub</a>
          <a href="#" class="text-muted hover:text-accent transition-colors">LinkedIn</a>
        </div>
      </div>
    </nav>
  </div>
</header>

<style>
  [x-cloak] { display: none !important; }
</style>
