<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>C</text></svg>">
  <title>Mis Certificados | Chumbi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            accent: '#E85D4C',
            'accent-hover': '#D14836',
            cream: '#FAF8F5',
            paper: '#F5F2ED',
            ink: '#2D2A26',
            charcoal: '#0F0E0D',
            'charcoal-light': '#1A1816',
            ash: '#E8E4DE',
            stone: '#8C8579',
          },
          fontFamily: {
            display: ['Instrument Serif', 'serif'],
            body: ['Outfit', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-cream dark:bg-charcoal text-ink dark:text-ash font-body antialiased min-h-screen"
      x-data="{
        ...createAuthComponent(),
        certificates: [],
        loadingCerts: true,

        async init() {
          await AuthStore.init();
          this.user = AuthStore.user;
          this.profile = AuthStore.profile;
          this.loading = false;

          if (!this.user) {
            window.location.href = '/auth/login.html';
            return;
          }

          window.addEventListener('auth:changed', (e) => {
            this.user = e.detail.user;
            this.profile = e.detail.profile;
            if (!this.user) {
              window.location.href = '/auth/login.html';
            }
          });

          await this.loadCertificates();
        },

        async loadCertificates() {
          if (!window.supabaseClient) {
            this.loadingCerts = false;
            return;
          }

          try {
            const { data, error } = await supabaseClient
              .from('certificates')
              .select('*, courses(title, slug, thumbnail_url)')
              .eq('user_id', this.user.id)
              .order('issued_at', { ascending: false });

            if (!error) {
              this.certificates = data || [];
            }
          } catch (error) {
            console.error('Error cargando certificados:', error);
          }

          this.loadingCerts = false;
        },

        formatDate(date) {
          return new Date(date).toLocaleDateString('es-ES', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });
        }
      }"
      x-init="$nextTick(() => { document.documentElement.classList.toggle('dark', localStorage.getItem('darkMode') === 'true') })">

  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-cream/90 dark:bg-charcoal/90 backdrop-blur-xl border-b border-ink/5 dark:border-ash/5">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="../../index.html" class="flex items-center gap-3">
        <div class="w-10 h-10">
          <svg viewBox="0 0 40 40" class="w-full h-full">
            <path d="M20 4 C32 4 36 12 36 20 C36 28 32 36 20 36 C10 36 4 30 4 22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="text-accent"/>
            <text x="20" y="26" text-anchor="middle" class="text-ink dark:text-ash font-display text-sm" fill="currentColor">C</text>
          </svg>
        </div>
        <span class="font-display text-lg text-ink dark:text-ash">Chumbi</span>
      </a>

      <nav class="flex items-center gap-4">
        <a href="../index.html" class="text-stone hover:text-accent transition-colors text-sm">Cursos</a>
        <a href="index.html" class="text-stone hover:text-accent transition-colors text-sm">Dashboard</a>
        <button
          @click="signOut()"
          class="w-10 h-10 rounded-full bg-ink/5 dark:bg-ash/10 flex items-center justify-center hover:bg-red-500 hover:text-cream transition-all"
          title="Salir"
        >
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="pt-24 pb-12 px-6">
    <div class="max-w-4xl mx-auto">

      <!-- Header -->
      <div class="mb-12">
        <a href="index.html" class="inline-flex items-center gap-2 text-stone hover:text-accent transition-colors text-sm mb-4">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          Volver al dashboard
        </a>
        <h1 class="font-display text-4xl text-ink dark:text-ash">Mis Certificados</h1>
        <p class="text-stone mt-2">Todos los certificados que has obtenido</p>
      </div>

      <!-- Loading -->
      <div x-show="loading || loadingCerts" class="flex items-center justify-center py-20">
        <div class="animate-spin w-8 h-8 border-2 border-accent border-t-transparent rounded-full"></div>
      </div>

      <!-- Certificates Grid -->
      <div x-show="!loading && !loadingCerts" x-cloak>

        <!-- Has certificates -->
        <div x-show="certificates.length > 0" class="space-y-6">
          <template x-for="cert in certificates" :key="cert.id">
            <div class="bg-paper dark:bg-charcoal-light rounded-2xl overflow-hidden border border-ink/5 dark:border-ash/10">
              <div class="md:flex">
                <!-- Certificate Preview -->
                <div class="md:w-64 bg-gradient-to-br from-accent/20 to-accent/5 p-8 flex items-center justify-center">
                  <div class="text-center">
                    <div class="w-20 h-20 mx-auto mb-4">
                      <!-- Enso circle -->
                      <svg viewBox="0 0 100 100" class="w-full h-full">
                        <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="4" class="text-accent" stroke-dasharray="200" stroke-dashoffset="30"/>
                      </svg>
                    </div>
                    <p class="text-xs text-stone uppercase tracking-wider">Certificado</p>
                  </div>
                </div>

                <!-- Info -->
                <div class="flex-grow p-6">
                  <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4">
                    <div>
                      <h3 class="font-display text-xl text-ink dark:text-ash mb-1" x-text="cert.courses?.title || 'Curso'"></h3>
                      <p class="text-stone text-sm mb-3">
                        Emitido el <span x-text="formatDate(cert.issued_at)"></span>
                      </p>
                      <p class="text-xs text-stone">
                        Codigo: <span class="font-mono" x-text="cert.certificate_code"></span>
                      </p>
                    </div>

                    <div class="flex flex-wrap gap-2">
                      <a
                        :href="cert.pdf_url"
                        target="_blank"
                        class="inline-flex items-center gap-2 bg-accent hover:bg-accent-hover text-cream px-4 py-2 rounded-lg text-sm transition-colors"
                      >
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                        </svg>
                        Descargar PDF
                      </a>
                      <button
                        @click="navigator.clipboard.writeText(cert.verification_url || window.location.origin + '/lms/certificate/?code=' + cert.certificate_code)"
                        class="inline-flex items-center gap-2 bg-ink/5 dark:bg-ash/10 hover:bg-ink/10 dark:hover:bg-ash/20 px-4 py-2 rounded-lg text-sm transition-colors"
                      >
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                        </svg>
                        Copiar link
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>

        <!-- No certificates -->
        <div x-show="certificates.length === 0" class="bg-paper dark:bg-charcoal-light rounded-2xl p-12 border border-ink/5 dark:border-ash/10 text-center">
          <div class="w-20 h-20 bg-accent/10 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10 text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
            </svg>
          </div>
          <h3 class="font-display text-2xl text-ink dark:text-ash mb-2">Aun no tienes certificados</h3>
          <p class="text-stone mb-8 max-w-md mx-auto">
            Completa un curso para obtener tu primer certificado. Los certificados se generan automaticamente al finalizar todas las lecciones.
          </p>
          <a href="../index.html" class="inline-flex items-center gap-2 bg-accent hover:bg-accent-hover text-cream px-6 py-3 rounded-full transition-colors">
            Explorar cursos
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
            </svg>
          </a>
        </div>

      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="../../assets/js/supabase-client.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
