<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>C</text></svg>">
  <title>Cursos | Chumbi Dojo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            accent: '#E85D4C',
            'accent-hover': '#D14836',
            cream: '#FAF8F5',
            paper: '#F5F2ED',
            ink: '#2D2A26',
            charcoal: '#0F0E0D',
            'charcoal-light': '#1A1816',
            ash: '#E8E4DE',
            stone: '#8C8579',
          },
          fontFamily: {
            display: ['Instrument Serif', 'serif'],
            body: ['Outfit', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
  </style>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-cream dark:bg-charcoal text-ink dark:text-ash font-body antialiased min-h-screen"
      x-data="{
        darkMode: localStorage.getItem('darkMode') === 'true',
        user: null,
        profile: null,
        courses: [],
        filteredCourses: [],
        loading: true,
        filter: 'all',
        searchQuery: '',

        async init() {
          document.documentElement.classList.toggle('dark', this.darkMode);

          // Inicializar auth
          await AuthStore.init();
          this.user = AuthStore.user;
          this.profile = AuthStore.profile;

          // Escuchar cambios
          window.addEventListener('auth:changed', (e) => {
            this.user = e.detail.user;
            this.profile = e.detail.profile;
          });

          // Cargar cursos
          await this.loadCourses();
        },

        async loadCourses() {
          if (!window.supabaseClient) {
            // Demo data si no hay Supabase
            this.courses = [
              {
                id: '1',
                slug: 'introduccion-al-dojo',
                title: 'Introduccion al Dojo Digital',
                description: 'Aprende los fundamentos del pensamiento creativo y la metodologia del dojo.',
                price_tier: 'free',
                difficulty_level: 'beginner',
                estimated_hours: 2,
                thumbnail_url: null,
                tags: ['fundamentos', 'creatividad']
              },
              {
                id: '2',
                slug: 'diseno-web-moderno',
                title: 'Diseno Web Moderno',
                description: 'Domina las tecnicas de diseno web con Tailwind CSS, Alpine.js y mas.',
                price_tier: 'premium',
                difficulty_level: 'intermediate',
                estimated_hours: 8,
                thumbnail_url: null,
                tags: ['web', 'css', 'javascript']
              },
              {
                id: '3',
                slug: 'productividad-zen',
                title: 'Productividad Zen',
                description: 'Sistemas y habitos para una vida mas enfocada y productiva.',
                price_tier: 'free',
                difficulty_level: 'beginner',
                estimated_hours: 3,
                thumbnail_url: null,
                tags: ['productividad', 'habitos']
              }
            ];
            this.filteredCourses = [...this.courses];
            this.loading = false;
            return;
          }

          try {
            const { data, error } = await supabaseClient
              .from('courses')
              .select('*')
              .eq('is_published', true)
              .order('order_index', { ascending: true });

            if (!error && data) {
              this.courses = data;
              this.filteredCourses = [...data];
            }
          } catch (error) {
            console.error('Error cargando cursos:', error);
          }

          this.loading = false;
        },

        applyFilters() {
          let result = [...this.courses];

          // Filtrar por tier
          if (this.filter !== 'all') {
            result = result.filter(c => c.price_tier === this.filter);
          }

          // Filtrar por busqueda
          if (this.searchQuery.trim()) {
            const query = this.searchQuery.toLowerCase();
            result = result.filter(c =>
              c.title.toLowerCase().includes(query) ||
              c.description?.toLowerCase().includes(query) ||
              c.tags?.some(t => t.toLowerCase().includes(query))
            );
          }

          this.filteredCourses = result;
        },

        getTierBadge(tier) {
          const badges = {
            'free': { label: 'Gratis', class: 'bg-green-500/20 text-green-600 dark:text-green-400' },
            'premium': { label: 'Premium', class: 'bg-amber-500/20 text-amber-600 dark:text-amber-400' },
            'vip': { label: 'VIP', class: 'bg-purple-500/20 text-purple-600 dark:text-purple-400' }
          };
          return badges[tier] || badges.free;
        },

        getDifficultyLabel(level) {
          const labels = {
            'beginner': 'Principiante',
            'intermediate': 'Intermedio',
            'advanced': 'Avanzado'
          };
          return labels[level] || level;
        },

        canAccess(course) {
          if (course.price_tier === 'free') return true;
          if (!this.user) return false;
          return AuthStore.hasAccessToTier(course.price_tier);
        }
      }"
      x-init="init()">

  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-cream/90 dark:bg-charcoal/90 backdrop-blur-xl border-b border-ink/5 dark:border-ash/5">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-3">
        <div class="w-10 h-10">
          <svg viewBox="0 0 40 40" class="w-full h-full">
            <path d="M20 4 C32 4 36 12 36 20 C36 28 32 36 20 36 C10 36 4 30 4 22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="text-accent"/>
            <text x="20" y="26" text-anchor="middle" class="text-ink dark:text-ash font-display text-sm" fill="currentColor">C</text>
          </svg>
        </div>
        <span class="font-display text-lg text-ink dark:text-ash">Chumbi Dojo</span>
      </a>

      <nav class="flex items-center gap-4">
        <!-- Dark mode toggle -->
        <button
          @click="darkMode = !darkMode; localStorage.setItem('darkMode', darkMode); document.documentElement.classList.toggle('dark', darkMode)"
          class="w-10 h-10 rounded-full bg-ink/5 dark:bg-ash/10 flex items-center justify-center hover:bg-accent hover:text-cream transition-all"
        >
          <svg x-show="!darkMode" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
          </svg>
          <svg x-show="darkMode" x-cloak class="w-5 h-5 text-amber-400" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
          </svg>
        </button>

        <!-- Auth buttons -->
        <template x-if="!user">
          <div class="flex items-center gap-2">
            <a href="../auth/login.html" class="text-stone hover:text-accent transition-colors text-sm">Entrar</a>
            <a href="../auth/register.html" class="bg-accent hover:bg-accent-hover text-cream px-4 py-2 rounded-full text-sm transition-colors">Crear cuenta</a>
          </div>
        </template>

        <template x-if="user">
          <a href="dashboard/" class="flex items-center gap-2 bg-accent hover:bg-accent-hover text-cream px-4 py-2 rounded-full text-sm transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            Mi Dojo
          </a>
        </template>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="pt-32 pb-16 px-6">
    <div class="max-w-6xl mx-auto text-center">
      <h1 class="font-display text-5xl md:text-6xl text-ink dark:text-ash mb-4">
        Aprende en el <span class="text-accent">Dojo</span>
      </h1>
      <p class="text-stone text-lg md:text-xl max-w-2xl mx-auto">
        Cursos practicos para desarrollar tus habilidades creativas y tecnicas
      </p>
    </div>
  </section>

  <!-- Filters Section -->
  <section class="px-6 pb-8">
    <div class="max-w-6xl mx-auto">
      <div class="flex flex-col md:flex-row gap-4 items-start md:items-center justify-between">
        <!-- Search -->
        <div class="relative w-full md:w-80">
          <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-stone" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input
            type="text"
            x-model="searchQuery"
            @input="applyFilters()"
            placeholder="Buscar cursos..."
            class="w-full pl-12 pr-4 py-3 rounded-xl bg-paper dark:bg-charcoal-light border border-ink/10 dark:border-ash/10 focus:border-accent outline-none transition-all text-ink dark:text-ash placeholder:text-stone"
          />
        </div>

        <!-- Filter tabs -->
        <div class="flex gap-2 flex-wrap">
          <button
            @click="filter = 'all'; applyFilters()"
            :class="filter === 'all' ? 'bg-accent text-cream' : 'bg-paper dark:bg-charcoal-light text-stone hover:text-ink dark:hover:text-ash'"
            class="px-4 py-2 rounded-full text-sm transition-all border border-transparent"
          >
            Todos
          </button>
          <button
            @click="filter = 'free'; applyFilters()"
            :class="filter === 'free' ? 'bg-green-500 text-white' : 'bg-paper dark:bg-charcoal-light text-stone hover:text-ink dark:hover:text-ash'"
            class="px-4 py-2 rounded-full text-sm transition-all"
          >
            Gratis
          </button>
          <button
            @click="filter = 'premium'; applyFilters()"
            :class="filter === 'premium' ? 'bg-amber-500 text-white' : 'bg-paper dark:bg-charcoal-light text-stone hover:text-ink dark:hover:text-ash'"
            class="px-4 py-2 rounded-full text-sm transition-all"
          >
            Premium
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Courses Grid -->
  <section class="px-6 pb-20">
    <div class="max-w-6xl mx-auto">

      <!-- Loading -->
      <div x-show="loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <template x-for="i in 6">
          <div class="bg-paper dark:bg-charcoal-light rounded-2xl overflow-hidden border border-ink/5 dark:border-ash/10 animate-pulse">
            <div class="aspect-video bg-ink/10 dark:bg-ash/10"></div>
            <div class="p-6">
              <div class="h-4 bg-ink/10 dark:bg-ash/10 rounded w-1/4 mb-3"></div>
              <div class="h-6 bg-ink/10 dark:bg-ash/10 rounded w-3/4 mb-2"></div>
              <div class="h-4 bg-ink/10 dark:bg-ash/10 rounded w-full mb-4"></div>
              <div class="h-10 bg-ink/10 dark:bg-ash/10 rounded-full w-1/3"></div>
            </div>
          </div>
        </template>
      </div>

      <!-- Courses -->
      <div x-show="!loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <template x-for="course in filteredCourses" :key="course.id">
          <article class="group bg-paper dark:bg-charcoal-light rounded-2xl overflow-hidden border border-ink/5 dark:border-ash/10 hover:border-accent/30 transition-all">
            <!-- Thumbnail -->
            <div class="aspect-video bg-gradient-to-br from-accent/20 to-accent/5 relative overflow-hidden">
              <template x-if="course.thumbnail_url">
                <img :src="course.thumbnail_url" :alt="course.title" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"/>
              </template>
              <template x-if="!course.thumbnail_url">
                <div class="w-full h-full flex items-center justify-center">
                  <svg class="w-16 h-16 text-accent/30" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                  </svg>
                </div>
              </template>
              <!-- Tier badge -->
              <div class="absolute top-3 left-3">
                <span :class="getTierBadge(course.price_tier).class" class="px-3 py-1 rounded-full text-xs font-medium" x-text="getTierBadge(course.price_tier).label"></span>
              </div>
              <!-- Lock overlay for premium -->
              <div x-show="!canAccess(course)" class="absolute inset-0 bg-charcoal/60 flex items-center justify-center backdrop-blur-sm">
                <div class="text-center text-cream">
                  <svg class="w-8 h-8 mx-auto mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                  </svg>
                  <span class="text-sm">Contenido Premium</span>
                </div>
              </div>
            </div>

            <!-- Content -->
            <div class="p-6">
              <!-- Meta -->
              <div class="flex items-center gap-3 text-xs text-stone mb-3">
                <span class="flex items-center gap-1">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                  </svg>
                  <span x-text="course.estimated_hours + 'h'"></span>
                </span>
                <span x-text="getDifficultyLabel(course.difficulty_level)"></span>
              </div>

              <!-- Title -->
              <h3 class="font-display text-xl text-ink dark:text-ash group-hover:text-accent transition-colors mb-2" x-text="course.title"></h3>

              <!-- Description -->
              <p class="text-stone text-sm line-clamp-2 mb-4" x-text="course.description"></p>

              <!-- Tags -->
              <div class="flex flex-wrap gap-2 mb-4" x-show="course.tags && course.tags.length > 0">
                <template x-for="tag in (course.tags || []).slice(0, 3)" :key="tag">
                  <span class="px-2 py-1 bg-ink/5 dark:bg-ash/10 rounded text-xs text-stone" x-text="tag"></span>
                </template>
              </div>

              <!-- CTA -->
              <a
                :href="'course/?slug=' + course.slug"
                class="inline-flex items-center gap-2 text-accent hover:text-accent-hover font-medium text-sm transition-colors"
              >
                <span x-text="canAccess(course) ? 'Ver curso' : 'Desbloquear'"></span>
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
                </svg>
              </a>
            </div>
          </article>
        </template>
      </div>

      <!-- No results -->
      <div x-show="!loading && filteredCourses.length === 0" class="text-center py-16">
        <div class="w-16 h-16 bg-stone/10 rounded-full flex items-center justify-center mx-auto mb-4">
          <svg class="w-8 h-8 text-stone" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
        <h3 class="font-display text-xl text-ink dark:text-ash mb-2">No se encontraron cursos</h3>
        <p class="text-stone">Intenta con otros terminos de busqueda</p>
      </div>
    </div>
  </section>

  <!-- Scripts -->
  <script src="../assets/js/supabase-client.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
