<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>C</text></svg>">
  <title>Galeria | Chumbi Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            accent: '#FF6B6B',
            'accent-hover': '#FF5252',
            dark: '#0A0A0A',
            light: '#FAFAFA',
            muted: '#71717A',
          },
          fontFamily: {
            display: ['Space Grotesk', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
          },
          borderRadius: {
            'bento': '1.5rem',
          },
        }
      }
    }
  </script>
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <link rel="stylesheet" href="../assets/css/custom.css" />
</head>
<body class="bg-light dark:bg-dark text-dark dark:text-light font-body antialiased min-h-screen flex flex-col">

  <div data-include="header"></div>

  <main class="flex-grow max-w-6xl mx-auto px-6 pt-28 pb-16 w-full">

    <!-- Page Header -->
    <div class="mb-12" data-aos="fade-up">
      <span class="text-5xl mb-4 block">&#128247;</span>
      <h1 class="font-display text-4xl md:text-5xl font-bold">Galeria</h1>
      <p class="text-muted mt-4 text-lg max-w-2xl">
        Journey visual, momentos y capturas del camino creativo.
      </p>
    </div>

    <!-- Gallery Grid -->
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" data-aos="fade-up" data-aos-delay="100">
      <div class="aspect-square bg-gradient-to-br from-accent/20 to-accent/5 rounded-bento overflow-hidden group cursor-pointer">
        <div class="w-full h-full flex items-center justify-center text-4xl opacity-50 group-hover:opacity-100 transition-opacity">&#128247;</div>
      </div>
      <div class="aspect-square bg-gradient-to-br from-accent/15 to-accent/5 rounded-bento overflow-hidden group cursor-pointer">
        <div class="w-full h-full flex items-center justify-center text-4xl opacity-50 group-hover:opacity-100 transition-opacity">&#127796;</div>
      </div>
      <div class="aspect-square bg-gradient-to-br from-accent/25 to-accent/10 rounded-bento overflow-hidden group cursor-pointer">
        <div class="w-full h-full flex items-center justify-center text-4xl opacity-50 group-hover:opacity-100 transition-opacity">&#9749;</div>
      </div>
      <div class="aspect-square bg-gradient-to-br from-accent/10 to-accent/5 rounded-bento overflow-hidden group cursor-pointer">
        <div class="w-full h-full flex items-center justify-center text-4xl opacity-50 group-hover:opacity-100 transition-opacity">&#128187;</div>
      </div>
      <div class="aspect-square bg-gradient-to-br from-accent/20 to-accent/5 rounded-bento overflow-hidden group cursor-pointer">
        <div class="w-full h-full flex items-center justify-center text-4xl opacity-50 group-hover:opacity-100 transition-opacity">&#127759;</div>
      </div>
      <div class="aspect-square bg-gradient-to-br from-accent/15 to-accent/10 rounded-bento overflow-hidden group cursor-pointer">
        <div class="w-full h-full flex items-center justify-center text-4xl opacity-50 group-hover:opacity-100 transition-opacity">&#128218;</div>
      </div>
      <div class="aspect-square bg-gradient-to-br from-accent/30 to-accent/10 rounded-bento overflow-hidden group cursor-pointer">
        <div class="w-full h-full flex items-center justify-center text-4xl opacity-50 group-hover:opacity-100 transition-opacity">&#127926;</div>
      </div>
      <div class="aspect-square bg-gradient-to-br from-accent/10 to-accent/5 rounded-bento overflow-hidden group cursor-pointer">
        <div class="w-full h-full flex items-center justify-center text-4xl opacity-50 group-hover:opacity-100 transition-opacity">&#128161;</div>
      </div>
    </div>

    <!-- Info -->
    <div class="mt-12 bg-white dark:bg-white/5 rounded-bento p-8 border border-black/5 dark:border-white/10 text-center" data-aos="fade-up" data-aos-delay="150">
      <p class="text-muted">
        Pronto aqui encontraras imagenes de mi journey creativo.
        <br>Por ahora, estos son placeholders mientras organizo el contenido.
      </p>
    </div>

    <!-- Back link -->
    <div class="mt-12" data-aos="fade-up" data-aos-delay="200">
      <a href="../index.html" class="inline-flex items-center gap-2 text-accent hover:underline">
        <span>&larr;</span>
        <span>Volver al inicio</span>
      </a>
    </div>

  </main>

  <div data-include="footer"></div>

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="../assets/js/main.js"></script>

</body>
</html>
